[project]
name = "yanling"
version = "0.1.0"
description = "衍灵内核框架 — 通用 AI 自我进化系统内核"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
yanling = "yanling.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.setuptools.packages.find]
include = ["yanling*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
